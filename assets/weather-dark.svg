<svg xmlns="http://www.w3.org/2000/svg" width="744" height="124" viewBox="0 0 744 124" role="img" aria-label="杭州实时天气">
<style>@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
<circle cx="28" cy="25" r="3" fill="#3fb950" style="animation:pulse 2s ease infinite"/>
<text x="40" y="29" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="600" fill="#f0f6fc">杭州 · 此刻</text>
<text x="718" y="29" text-anchor="end" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8b949e">更新于 12:02</text>
<g style="animation:fadein .6s ease .1s backwards">
<text x="28" y="88" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34">🌦️</text>
<text x="86" y="90" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#f0f6fc">32°</text>
<text x="170" y="66" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#f0f6fc">毛毛雨</text>
<text x="170" y="88" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#8b949e">体感 38° · 湿度 64% · 风 13 km/h</text>
</g>
<line x1="478" y1="46" x2="478" y2="94" stroke="#30363d"/>
