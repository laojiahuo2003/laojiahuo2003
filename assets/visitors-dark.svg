<svg xmlns="http://www.w3.org/2000/svg" width="744" height="168" viewBox="0 0 744 168" role="img" aria-label="访客记录">
<style>
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes scanmove{from{transform:translateY(-40px)}to{transform:translateY(208px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
<clipPath id="card"><rect width="744" height="168" rx="14"/></clipPath>
<g clip-path="url(#card)"><rect x="0" y="0" width="744" height="30" fill="#3FB950" opacity="0.04" style="animation:scanmove 6.5s linear infinite"/></g>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C150C"/><stop offset="1" stop-color="#050A05"/></linearGradient></defs>
<rect width="744" height="168" rx="14" fill="url(#bg)" stroke="#1E2B1E"/>
<rect width="744" height="34" rx="14" fill="#162316"/>
<rect y="17" width="744" height="17" fill="#162316"/>
<circle cx="24" cy="17" r="6.5" fill="#FF5F57"/>
<circle cx="48" cy="17" r="6.5" fill="#FEBC2E"/>
<circle cx="72" cy="17" r="6.5" fill="#28C840"/>
<text x="372" y="22" text-anchor="middle" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#7DBB7D">老家伙 @ laojiahuo2003: ~/visitor.log</text>
<circle cx="30" cy="54" r="3" fill="#3FB950" style="animation:pulse 2s ease infinite"/>
<text x="42" y="58" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#7DBB7D">VISITOR LOG · LIVE</text>
<text x="26" y="92" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="#A5D6A7" style="animation:fadein .6s ease .2s both">—</text>
<text x="26" y="112" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#7DBB7D">演示数据 · 等待 CI 首刷</text>
<text x="348" y="58" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#7DBB7D">DAILY VIEWS</text>
<line x1="348" y1="130" x2="718" y2="130" stroke="#1E3A1E" stroke-dasharray="2 4"/>
<text x="388" y="100" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#5A7A5A">等待数据 …</text>
<line x1="16" y1="138" x2="728" y2="138" stroke="#1E3A1E" stroke-dasharray="2 4"/>
<text x="26" y="152" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#7DBB7D">▸ 每一次到访都被记录 · 感谢路过，欢迎常来 ✨</text>
<rect x="604" y="143" width="7" height="10" fill="#3FB950" style="animation:blink 1.1s steps(1) infinite"/>
<text x="722" y="152" text-anchor="end" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#7DBB7D">powered by GitHub Insights</text>
</svg>
