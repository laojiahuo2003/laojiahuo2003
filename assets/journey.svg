<svg xmlns="http://www.w3.org/2000/svg" width="744" height="124" viewBox="0 0 744 124" role="img" aria-label="足迹条">
<style>
@keyframes breathe{0%,100%{opacity:.4}50%{opacity:.9}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes ringdraw{from{stroke-dashoffset:138}}
@keyframes flick{0%,100%{transform:scale(1)}30%{transform:scale(1.15)}60%{transform:scale(.95)}}
@keyframes scan{0%{opacity:.06}100%{opacity:.06}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 4s ease infinite}
.flick{animation:flick 3.6s ease-in-out infinite;transform-origin:center}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAFDFA"/><stop offset="1" stop-color="#F0F8F0"/></linearGradient></defs>
<rect width="744" height="124" rx="14" fill="url(#bg)" stroke="#D5E8D5"/>
