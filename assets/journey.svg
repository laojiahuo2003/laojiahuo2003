<circle cx="62" cy="62" r="22" fill="none" stroke="#1A7F37" stroke-width="5" stroke-linecap="round" stroke-dasharray="138" stroke-dashoffset="53" style="animation:ringdraw 1.6s cubic-bezier(.2,.8,.2,1) backwards"/>
