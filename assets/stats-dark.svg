<svg xmlns="http://www.w3.org/2000/svg" width="744" height="236" viewBox="0 0 744 236" role="img" aria-label="统计 neofetch">
<style>
@keyframes breathe{0%,100%{opacity:.4}50%{opacity:.9}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@keyframes ringdraw{from{stroke-dashoffset:138}}
@keyframes flick{0%,100%{transform:scale(1)}30%{transform:scale(1.15)}60%{transform:scale(.95)}}
@keyframes scan{0%{opacity:.06}100%{opacity:.06}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pulse{animation:pulse 2s ease infinite}
.flick{animation:flick 1.8s ease-in-out infinite;transform-origin:center}
</style>
