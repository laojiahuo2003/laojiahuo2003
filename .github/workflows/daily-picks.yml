name: 🔥 更新主页每日精选

# 在每日报告生成后（北京时间 09:00 / 18:00 报告，09:35 / 18:35 抓取）自动更新主页
on:
  schedule:
    - cron: "35 1 * * *"
    - cron: "35 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出主页仓库
        uses: actions/checkout@v4

      - name: 更新每日精选
        run: python3 scripts/update_daily_picks.py

      - name: 提交并推送
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "🔥 更新主页每日精选" || echo "无变化，跳过"
          git push
