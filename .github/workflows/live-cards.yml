name: 🎴 生成实时卡片

# 每小时刷新：足迹条 / 每日精选 / 统计 / 作息钟 / 天气（GitHub API + 日报仓库 + open-meteo）
on:
  push:
    branches: [main]
    paths: ['scripts/gen_live_cards.py', 'scripts/gen_visitors.py', 'scripts/gen_clock.py', 'scripts/gen_weather.py', '.github/workflows/live-cards.yml']
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 与贪吃蛇 workflow 共用同一组，串行推送 main，避免互相撞车；后来的排队等，不取消先来的
concurrency:
  group: bot-push-main
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出主页仓库
        uses: actions/checkout@v4

      - name: 生成实时卡片（足迹 / 精选 / 统计）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/gen_live_cards.py

      - name: 生成作息钟（Events API）与天气卡（open-meteo）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/gen_clock.py
          python3 scripts/gen_weather.py

      # Traffic API 需要 administration 权限，GITHUB_TOKEN 给不了，必须用 PAT（repo secret: GH_PAT）
      - name: 生成访客卡片（Traffic API）
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: python3 scripts/gen_visitors.py

      - name: 提交并推送
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "🎴 刷新实时卡片" || echo "无变化，跳过"
          # 远端可能已被贪吃蛇等其他 workflow 推进，先 rebase 再推
          git pull --rebase
          git push
